{% extends "base.html" %}

{% block title %}Адміністратор{% endblock %}

{% block content %}
<section class="section container">

        <p class="eyebrow">ADMIN PANEL</p>

        <h1>ADMINISTRATOR</h1>

        <p>Вік адміністратора: {{ age }}</p>

        <a class="button primary"

            Повернутися до привітання
        </a>
    </div>
</section>
{% endblock %}
