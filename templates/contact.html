
{% extends "base.html" %}

{% block content %}
<main>
    <section class="section container" id="contact">
        <div class="section-heading">
            <p class="eyebrow">Будьмо на зв'язку</p>
            <h1>Контакти</h1>
            <p>Маєш запитання або пропозицію? Напиши мені!</p>
        </div>

        <div class="contact-card">
            <div class="contact-info">
                <h2>Контактні дані</h2>
                <p>Відкритий до навчальних проєктів, практики та нових можливостей.</p>

                <div class="contact-links">
                    <a href="https://github.com/bohdanbobrys24-source/flask-app-lab/"
                       target="_blank"
                       rel="noopener noreferrer">
                        GitHub
                    </a>
                    <p>Україна</p>
                </div>
            </div>

            <div class="contact-form-wrap">
                <h2>Надіслати повідомлення</h2>

                <form action="#" method="post"
                      onsubmit="event.preventDefault(); alert('Дякую! Це демонстраційна форма. Повідомлення не надіслано.');">

                    <div class="form-group">
                        <label for="name">Ваше ім'я</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Введіть ваше ім'я"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Електронна пошта</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@gmail.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="subject">Тема повідомлення</label>
                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Тема повідомлення"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="message">Повідомлення</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Напишіть ваше повідомлення..."
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="button primary">
                        Надіслати повідомлення
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>
{% endblock %}
